<!DOCTYPE html>

<html lang="en">
    <head >
        <meta charset="UTF-8">
        <title>Text Editor</title>
        <script type="module" src="build/script.js" defer></script>

        <style>
            #editor-wrapper {
                position: relative; /* anchor for the placeholder */
            }

            #text-box {
                display: flex;
                flex-direction: column;
                cursor: text;
                position: relative;
                min-height: 10em; /* larger area to click on */
                min-width: 10em;
            }

            #text-box > div {
                white-space: pre-wrap;
                min-height: 1.2em;
            }
            
            #placeholder {
                position: absolute;
                color: #999;
                font-style: italic;
                pointer-events: none; /* clicks fall through to the editor */
            }


            #text-box.is-empty

            .cursor {
                display: inline-block;
                width: 2px;
                height: 1.2em;
                background-color: currentColor;
                vertical-align: text-bottom;
                animation: blink 1s step-end infinite;
            }

            .selection {
                background-color: #0066cc;
                color: white;
            }

            @keyframes blink {
                0%, 100% { opacity: 1; }
                50% { opacity: 0; }
            }
        </style>
    </head>

    <body>
        <div id="editor-wrapper">
            <div id="placeholder"></div>
            <div id="text-box" tabindex="0">
                <div id="line-1"></div>
            </div>
        </div>
    </body>
</html>
