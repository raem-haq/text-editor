<!DOCTYPE html>

<html lang="en">
    <head >
        <meta charset="UTF-8">
        <title>Text Editor</title>
        <script type="module" src="build/script.js" defer></script>

        <style>
            #text-box {
                display: flex;
                flex-direction: column;
            }

            #text-box > div {
                white-space: pre-wrap;
            }

            .cursor {
                display: inline-block;
                width: 2px;
                height: 1.2em;
                background-color: currentColor;
                vertical-align: text-bottom;
                animation: blink 1s step-end infinite;
            }

            .selection {
                background-color: #0066cc;
                color: white;
            }

            @keyframes blink {
                0%, 100% { opacity: 1; }
                50% { opacity: 0; }
            }
        </style>
    </head>

    <body>
        <div id="text-box" tabindex="0">
            <div id="line-1">Edit Text</div>
        </div>
    </body>
</html>
